name: Traffic badge

# GitHub's traffic API is a rolling 14-day window with no history before
# that. This snapshots it daily into badges/clone-history.json so the README
# badge can show an all-time total instead of "last 14 days".

on:
  schedule:
    - cron: '30 6 * * *'  # daily; offset from digest/sync-upstream/check_feeds crons
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'SatanicMechanic/n2ksecdigest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: '3.12'

      # TEMPORARY: the failure surfaced as `gh` exiting 1 with no output at
      # all, which a normal 401/403 never does. This runs the same call
      # outside Python with stderr forced into the log. Delete once diagnosed.
      - name: DEBUG raw gh api call
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          echo "--- gh version ---"
          gh --version 2>&1 || echo "gh --version exit: $?"
          echo "--- token sanity (no value printed) ---"
          echo "length: ${#GH_TOKEN}"
          case "$GH_TOKEN" in
            *[[:space:]]*) echo "WARNING: token contains whitespace" ;;
            *) echo "no embedded whitespace" ;;
          esac
          echo "--- gh auth status ---"
          gh auth status 2>&1 || echo "auth status exit: $?"
          echo "--- gh api -i ---"
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones" -i 2>&1 || echo "api exit: $?"

      - name: Update traffic badge
        env:
          # repos/{owner}/{repo}/traffic/clones needs the "Administration"
          # repo permission — not grantable to the built-in GITHUB_TOKEN, so
          # this needs a fine-grained PAT (this repo only, Administration:
          # Read-only) stored as TRAFFIC_PAT.
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python update_traffic_badge.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- badges/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add badges/
            git commit -m "chore: update traffic badge [skip ci]"
            git push
          fi
