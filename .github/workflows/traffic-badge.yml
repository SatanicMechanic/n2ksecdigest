name: Traffic badge

# GitHub's traffic API is a rolling 14-day window with no history before
# that. This snapshots it daily into badges/clone-history.json so the README
# badge can show an all-time total instead of "last 14 days".

on:
  schedule:
    - cron: '30 6 * * *'  # daily; offset from digest/sync-upstream/check_feeds crons
  workflow_dispatch:

# The PAT below does the pushing, so GITHUB_TOKEN needs no write access.
permissions:
  contents: read

jobs:
  update-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'SatanicMechanic/n2ksecdigest'
    steps:
      # Checkout with the PAT so the push below carries it: main's ruleset
      # requires a PR + the "test" check, and GitHub Actions is not an
      # eligible bypass actor. The PAT acts as a repository admin, which is
      # already on the bypass list. Safe here because this job installs no
      # third-party dependencies — see the note in digest.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.TRAFFIC_PAT }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Update traffic badge
        env:
          # repos/{owner}/{repo}/traffic/clones needs the "Administration"
          # repo permission — not grantable to the built-in GITHUB_TOKEN, so
          # this needs a fine-grained PAT (this repo only, Administration:
          # Read-only) stored as TRAFFIC_PAT.
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python update_traffic_badge.py

      - name: Commit if changed
        run: |
          # Stage first, then diff the index: badges/ is untracked on the very
          # first run and `git diff` ignores untracked files, so checking
          # before staging silently skipped the commit forever.
          git add badges/
          if ! git diff --cached --quiet -- badges/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update traffic badge [skip ci]"
            git push
          fi
