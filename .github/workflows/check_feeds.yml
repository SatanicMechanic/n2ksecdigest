name: Feed Health Check

on:
  schedule:
    # Weekly, Sundays at 15:00 UTC
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This repo is a template — inert here, active in private mirrors.
    if: github.repository != 'SatanicMechanic/n2ksecdigest'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv venv
      - run: uv pip install -r requirements.txt
      - run: uv run python check_feeds.py
